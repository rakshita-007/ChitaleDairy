
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Chitale Dairy</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
  	body{
  		margin: 0px;
  		background-image: url(pics/cow.jpg);
  		background-size: cover;
  		background-repeat: no-repeat;
  		background-position: center;
  		background-attachment: fixed;
  	}
  	.brandname{
  		background: linear-gradient(to left, gold, limegreen);
  		color: white;
  		padding: 20px;
  		text-align: center;
  	}
  	.card{
  		background: #d4edda;
  	}
  	.glasslook{
  		background: rgba(0, 0, 0, 0.5);
  		color: white;
  	}
  </style>
  <script>
  	function setMilkRate()
  	{
  		var tom=document.f1.tom.value;

  		if(tom=="Cow")
  		{
  			rate=60;
  		}
  		if(tom=="Buffalo")
  		{
  			rate=70;
  		}
  		if(tom=="GiriCow")
  		{
  			rate=100;
  		}

  		document.f1.rate.value=rate;
  	}

  	function show_bill()
  	{
  		var rate=parseInt(document.f1.rate.value);
  		var qty=parseInt(document.f1.qty.value);

  		bill_amt=rate*qty;

  		document.f1.bill.value=bill_amt;
  	}
  </script>
</head>
<body>

	<div class="brandname">
		<h2>Chitale Dairy</h2>
	</div>

	<div class="container mt-4 w-50">
		<div class="card glasslook">
			<div class="card-header bg-warning">
				<h3>Product Billing</h3>
			</div>

			<div class="card-body">
				<form name="f1">
					<div class="row form-group">
						<div class="col-sm-4">
							<label>Customer Name</label>
						</div>

						<div class="col-sm-8">
							<input type="text" name="cname" class="form-control">
						</div>
					</div>

					<div class="row form-group">
						<div class="col-sm-4">
							<label>Type of Milk</label>
						</div>

						<div class="col-sm-8">
							<input type="radio" name="tom" value="Cow" onclick="setMilkRate()">Cow Rs. 60 <br>
							<input type="radio" name="tom" value="Buffalo" onclick="setMilkRate()">Buffalo Rs. 70 <br>
							<input type="radio" name="tom" value="GiriCow" onclick="setMilkRate()">GiriCow Rs. 100
						</div>
					</div>

					<div class="row form-group">
						<div class="col-sm-4">
							<label>Milk Rate</label>
						</div>

						<div class="col-sm-8">
							<input type="number" name="rate" disabled>
						</div>
					</div>

					<div class="row form-group">
						<div  class="col-sm-4">
							<label>Milk Quantity</label>
						</div>

						<div class="col-sm-8">
							<input type="number" name="qty" onkeyup="show_bill()">
						</div>
					</div>

					<div class="row form-group">
						<div class="col-sm-4">
							<label>Total Bill Amount</label>
						</div>

						<div class="col-sm-8">
							<input type="number" name="bill">
						</div>
					</div>
					</div> <!--end of card-body-->

					<div class="card-footer">
					    <button class="btn btn-success" type="submit">Submit</button>
					    <button class="btn btn-primary" type="button" onclick="print()">Print</button>
					</div>
				</form>
			
		</div>  <!--end of card-->
	</div>  <!--end of container-->

</body>
</html>
